server:
  port: 8083

spring:
  application:
    name: task-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${TASK_DB_NAME:task_service_db}
    username: ${TASK_DB_USERNAME}
    password: ${TASK_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true