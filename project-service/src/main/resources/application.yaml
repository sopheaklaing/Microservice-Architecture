server:
  port: 8082

spring:
  application:
    name: project-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${PROJECT_DB_NAME:project_service_db}
    username: ${PROJECT_DB_USERNAME}
    password: ${PROJECT_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true